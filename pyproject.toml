[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlresell-sdk"
version = "1.0.0"
description = "Python SDK for the ControlResell public API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "attrs>=23.2", "python-dateutil>=2.8"]

[project.urls]
Homepage = "https://github.com/controlresell/python-sdk"
Repository = "https://github.com/controlresell/python-sdk"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/controlresell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
